name: OTA Release

on:
  push:
    branches:
      - main
    paths:
      - "client/src/**"
      - "client/public/**"
      - "client/index.html"
      - "client/package.json"
      - "client/package-lock.json"
      - "client/vite.config.*"
      - "client/capacitor.config.*"
      - "client/tsconfig*.json"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # SETUP NODE
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      # ======================================================
      # DETERMINE NEXT OTA VERSION
      # ======================================================

      - name: Determine next OTA version
        id: version
        shell: bash
        run: |
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION="1.0.0"
          else
            CURRENT_VERSION="${LATEST_TAG#v}"

            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

            NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          echo "Latest version: ${LATEST_TAG:-none}"
          echo "Next OTA version: $NEXT_VERSION"

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      # ======================================================
      # UPDATE CLIENT VERSION
      # ======================================================

      - name: Update client version
        working-directory: client
        run: |
          npm version "${{ steps.version.outputs.version }}" \
            --no-git-tag-version

      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        working-directory: client
        run: npm ci

      # ======================================================
      # BUILD FRONTEND
      # ======================================================

      - name: Build frontend
        working-directory: client
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Verify Google Client ID in build
        working-directory: client
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        shell: bash
        run: |
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "❌ VITE_GOOGLE_CLIENT_ID secret is empty"
            exit 1
          fi

          echo "✅ VITE_GOOGLE_CLIENT_ID secret exists"

          if ! grep -R -q "$VITE_GOOGLE_CLIENT_ID" dist/assets; then
            echo "❌ Google Client ID was not found in the production build"
            exit 1
          fi

          echo "✅ Google Client ID is present in the production build"
      - name: Check API URL in build
        working-directory: client
        shell: bash
        run: |
          if grep -R -q "https://moboxd-backend.onrender.com" dist/assets; then
            echo "✅ Backend API URL exists in build"
          else
            echo "❌ Backend API URL is NOT in build"
            exit 1
          fi

      # ======================================================
      # CREATE OTA ZIP
      # ======================================================

      - name: Generate OTA bundle
        working-directory: client
        run: |
          npx @capgo/cli bundle zip \
            --path ./dist \
            --json

      # ======================================================
      # FIND OTA ZIP
      # ======================================================

      - name: Find OTA bundle
        id: bundle
        shell: bash
        run: |
          FILE=$(find client \
            -maxdepth 1 \
            -type f \
            -name "com.moboxd.app_${{ steps.version.outputs.version }}.zip" \
            -print \
            -quit)

          if [ -z "$FILE" ]; then
            echo "OTA bundle not found"
            exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      # ======================================================
      # CALCULATE CHECKSUM
      # ======================================================

      - name: Calculate checksum
        id: checksum
        shell: bash
        run: |
          CHECKSUM=$(sha256sum \
            "${{ steps.bundle.outputs.file }}" \
            | awk '{print $1}')

          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      # ======================================================
      # CREATE GITHUB RELEASE
      # ======================================================

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "v${{ steps.version.outputs.version }}" \
            "${{ steps.bundle.outputs.file }}" \
            --title "MoBoxd ${{ steps.version.outputs.version }}" \
            --generate-notes

      # ======================================================
      # UPDATE OTA MANIFEST
      # ======================================================

      - name: Update OTA manifest
        shell: bash
        run: |
          mkdir -p ota

          cat > ota/latest.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "url": "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/com.moboxd.app_${{ steps.version.outputs.version }}.zip",
            "checksum": "${{ steps.checksum.outputs.checksum }}"
          }
          EOF

      # ======================================================
      # COMMIT VERSION + MANIFEST
      # ======================================================

      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            client/package.json \
            client/package-lock.json \
            ota/latest.json

          git commit \
            -m "Release MoBoxd ${{ steps.version.outputs.version }}"

          git push
